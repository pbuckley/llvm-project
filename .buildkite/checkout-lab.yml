env:
  LLVM_DEMO_CHECKOUT_PROFILE: "${LLVM_DEMO_CHECKOUT_PROFILE}"
  LLVM_DEMO_REPO_URL: "https://github.com/pbuckley/llvm-project.git"

checkout:
  skip: true

steps:
  - group: ":git: Checkout performance lab — ${LLVM_DEMO_CHECKOUT_PROFILE}"
    key: "checkout-performance-lab"
    steps:
      - label: ":globe_with_meridians: Uncached network clone"
        key: "checkout-network"
        depends_on: "upload-repository-pipeline"
        command: |
          mkdir -p .buildkite/scripts
          buildkite-agent artifact download ".buildkite/scripts/checkout-benchmark.sh" . \
            --step upload-repository-pipeline
          chmod +x .buildkite/scripts/checkout-benchmark.sh
          .buildkite/scripts/checkout-benchmark.sh network "$${LLVM_DEMO_CHECKOUT_PROFILE}"
        agents:
          queue: "hosted-linux"
        artifact_paths:
          - "checkout-benchmark/network-*"
        timeout_in_minutes: 40

      - label: ":zap: Buildkite Git mirror clone"
        key: "checkout-mirror"
        depends_on: "upload-repository-pipeline"
        command: |
          mkdir -p .buildkite/scripts
          buildkite-agent artifact download ".buildkite/scripts/checkout-benchmark.sh" . \
            --step upload-repository-pipeline
          chmod +x .buildkite/scripts/checkout-benchmark.sh
          .buildkite/scripts/checkout-benchmark.sh mirror "$${LLVM_DEMO_CHECKOUT_PROFILE}"
        agents:
          queue: "hosted-linux"
        artifact_paths:
          - "checkout-benchmark/mirror-*"
        timeout_in_minutes: 40

      - label: ":bar_chart: Checkout comparison"
        key: "checkout-comparison"
        depends_on:
          - "checkout-network"
          - "checkout-mirror"
        command: |
          mkdir -p .buildkite/scripts checkout-benchmark
          buildkite-agent artifact download ".buildkite/scripts/compare-checkouts.py" . \
            --step upload-repository-pipeline
          buildkite-agent artifact download "checkout-benchmark/network-metrics.json" . \
            --step checkout-network
          buildkite-agent artifact download "checkout-benchmark/mirror-metrics.json" . \
            --step checkout-mirror
          python3 .buildkite/scripts/compare-checkouts.py \
            checkout-benchmark/network-metrics.json \
            checkout-benchmark/mirror-metrics.json \
            checkout-benchmark/comparison.md \
            checkout-benchmark/comparison.json
          buildkite-agent annotate --style success --context "llvm-checkout-lab" \
            < checkout-benchmark/comparison.md
        agents:
          queue: "hosted-linux"
        artifact_paths:
          - "checkout-benchmark/comparison.*"
        timeout_in_minutes: 10
