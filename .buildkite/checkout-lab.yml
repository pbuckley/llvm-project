env:
  LLVM_DEMO_CHECKOUT_PROFILE: "${LLVM_DEMO_CHECKOUT_PROFILE}"
  LLVM_DEMO_REPO_URL: "https://github.com/pbuckley/llvm-project.git"

checkout:
  depth: 2
  submodules: false

steps:
  - group: ":git: Self-hosted EKS checkout lab — ${LLVM_DEMO_CHECKOUT_PROFILE}"
    key: "checkout-performance-lab"
    steps:
      - label: ":globe_with_meridians: EKS network clone"
        key: "checkout-network"
        command: |
          bash .buildkite/scripts/checkout-benchmark.sh \
            network "$${LLVM_DEMO_CHECKOUT_PROFILE}" network
        agents:
          queue: "llvm-eks-mirror"
        artifact_paths:
          - "checkout-benchmark/network-*"
        timeout_in_minutes: 40

      - label: ":kubernetes: Self-hosted EKS Git mirror"
        key: "checkout-eks-mirror"
        command: |
          bash .buildkite/scripts/checkout-benchmark.sh \
            mirror "$${LLVM_DEMO_CHECKOUT_PROFILE}" eks-mirror
        agents:
          queue: "llvm-eks-mirror"
        artifact_paths:
          - "checkout-benchmark/eks-mirror-*"
        timeout_in_minutes: 40

      - label: ":bar_chart: Checkout comparison"
        key: "checkout-comparison"
        depends_on:
          - "checkout-network"
          - "checkout-eks-mirror"
        command: |
          mkdir -p checkout-benchmark
          buildkite-agent artifact download "checkout-benchmark/network-metrics.json" . \
            --step checkout-network
          buildkite-agent artifact download "checkout-benchmark/eks-mirror-metrics.json" . \
            --step checkout-eks-mirror
          python3 .buildkite/scripts/compare-checkouts.py \
            checkout-benchmark/network-metrics.json \
            checkout-benchmark/eks-mirror-metrics.json \
            checkout-benchmark/comparison.md \
            checkout-benchmark/comparison.json
          buildkite-agent annotate --style success --context "llvm-checkout-lab" \
            < checkout-benchmark/comparison.md
        agents:
          queue: "llvm-eks-mirror"
        artifact_paths:
          - "checkout-benchmark/comparison.*"
        timeout_in_minutes: 10
